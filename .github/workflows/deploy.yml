name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # azd required
      AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # App secrets
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
      # Connection Store (shared MongoDB with NextJS UI)
      CONNECTION_STORE_MONGODB_URI: ${{ secrets.CONNECTION_STORE_MONGODB_URI }}
      CONNECTION_STORE_DB_NAME: ${{ secrets.CONNECTION_STORE_DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" `
            --federated-credential-provider "github" `
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"
        shell: pwsh

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cancel Active Deployments
        run: |
          # Cancel any active deployments in the resource group
          RG_NAME="rg-${{ secrets.AZURE_ENV_NAME }}"
          echo "Checking for active deployments in $RG_NAME..."
          
          # Check if resource group exists
          if az group exists --name $RG_NAME | grep -q true; then
            # Get running deployments
            DEPLOYMENTS=$(az deployment group list --resource-group $RG_NAME --query "[?properties.provisioningState=='Running'].name" -o tsv 2>/dev/null || echo "")
            
            if [ -n "$DEPLOYMENTS" ]; then
              echo "Found active deployments, canceling..."
              for DEPLOYMENT in $DEPLOYMENTS; do
                echo "Canceling deployment: $DEPLOYMENT"
                az deployment group cancel --resource-group $RG_NAME --name $DEPLOYMENT || true
              done
              echo "Waiting 30 seconds for cancellation to complete..."
              sleep 30
            else
              echo "No active deployments found"
            fi
          else
            echo "Resource group $RG_NAME does not exist yet"
          fi

      - name: Provision Infrastructure
        run: azd provision --no-prompt

      - name: Get ACR Name
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group rg-${{ secrets.AZURE_ENV_NAME }} --query "[0].name" -o tsv)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "ACR Name: $ACR_NAME"

      - name: Log in to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ steps.acr.outputs.name }}.azurecr.io/db-agent:latest .
          docker push ${{ steps.acr.outputs.name }}.azurecr.io/db-agent:latest

      - name: Deploy Application
        run: azd deploy --no-prompt
